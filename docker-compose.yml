services:
  # 1. PostgreSQL - Lưu trữ dữ liệu cốt lõi
  postgres:
    image: postgres:15-alpine
    container_name: hotel_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hotel_db}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./1_infrastructure/postgres/init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql
      - ./1_infrastructure/postgres/seed.sql:/docker-entrypoint-initdb.d/seed.sql
      - ./1_infrastructure/operations/init-migration-history.sql:/docker-entrypoint-initdb.d/zz-migration-history.sql:ro
    networks:
      - hotel_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Redis - Bộ đệm (Cache) siêu tốc độ
  redis:
    image: redis:7-alpine
    container_name: hotel_redis
    restart: always
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    networks:
      - hotel_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  db_migrations:
    build:
      context: ./3_backend_core
    working_dir: /app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-hotel_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DB_NAME: ${POSTGRES_DB:-hotel_db}
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./1_infrastructure/postgres/migrations:/migrations:ro
      - ./1_infrastructure/operations/migrate.mjs:/operations/migrate.mjs:ro
    command: ["node", "/operations/migrate.mjs", "--apply"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hotel_network

  ai_service:
    build:
      context: ./2_ai_pricing_service
    restart: unless-stopped
    init: true
    environment:
      MARKET_CONTEXT_PROVIDER: ${MARKET_CONTEXT_PROVIDER:-native_nlp}
      MARKET_CONTEXT_MODEL: ${MARKET_CONTEXT_MODEL:-native_vn_nlp_v1}
    networks:
      - hotel_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend_core:
    build:
      context: ./3_backend_core
    restart: unless-stopped
    init: true
    environment:
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${BACKEND_DB_USER:-${POSTGRES_USER:-hotel_admin}}
      DB_PASSWORD: ${BACKEND_DB_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}}
      DB_NAME: ${POSTGRES_DB:-hotel_db}
      AI_SERVICE_URL: http://ai_service:8000/api/v1/predict-price
      AI_SHADOW_OPTIMIZER_URL: http://ai_service:8000/api/v1/optimize-price-shadow
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      HOTEL_TIMEZONE: ${HOTEL_TIMEZONE:-Asia/Bangkok}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-5000}
      AI_SHADOW_TIMEOUT_MS: ${AI_SHADOW_TIMEOUT_MS:-750}
      PRICING_QUOTE_TTL_SECONDS: ${PRICING_QUOTE_TTL_SECONDS:-900}
      REDIS_URL: redis://redis:6379
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-1500}
      ROOM_CATALOG_CACHE_TTL_SECONDS: ${ROOM_CATALOG_CACHE_TTL_SECONDS:-300}
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-hotel-backend-core}
      KAFKA_DOMAIN_EVENTS_TOPIC: ${KAFKA_DOMAIN_EVENTS_TOPIC:-hotel.domain-events.v1}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-1}
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_CONNECTION_TIMEOUT_MS: ${KAFKA_CONNECTION_TIMEOUT_MS:-2000}
      KAFKA_REQUEST_TIMEOUT_MS: ${KAFKA_REQUEST_TIMEOUT_MS:-5000}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      BOOKING_EXPIRY_POLL_MS: ${BOOKING_EXPIRY_POLL_MS:-15000}
    depends_on:
      db_migrations:
        condition: service_completed_successfully
      ai_service:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - hotel_network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/core/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend_nextjs:
    build:
      context: ./4_frontend_nextjs
      args:
        NEXT_PUBLIC_API_URL: /api/v1/core
    restart: unless-stopped
    init: true
    environment:
      NEXT_PUBLIC_API_URL: /api/v1/core
      BACKEND_API_URL: http://backend_core:3000/api/v1/core
    depends_on:
      backend_core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - hotel_network

  # 3. Kafka (Apache Official Image - Chế độ KRaft)
  kafka:
    image: apache/kafka:3.7.0
    container_name: hotel_kafka
    restart: always
    ports:
      - "${KAFKA_BIND_ADDRESS:-127.0.0.1}:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data_v2:/tmp/kafka-logs
    networks:
      - hotel_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # 4. Nginx - API Gateway
  nginx:
    image: nginx:alpine
    container_name: hotel_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./1_infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - hotel_network
    depends_on:
      frontend_nextjs:
        condition: service_healthy
      backend_core:
        condition: service_healthy

volumes:
  pg_data:
  kafka_data_v2:

networks:
  hotel_network:
    driver: bridge
