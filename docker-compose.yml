services:
  # 1. PostgreSQL - Lưu trữ dữ liệu cốt lõi
  postgres:
    image: postgres:15-alpine
    container_name: hotel_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hotel_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./1_infrastructure/postgres/init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql
      - ./1_infrastructure/postgres/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    networks:
      - hotel_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Redis - Bộ đệm (Cache) siêu tốc độ
  redis:
    image: redis:7-alpine
    container_name: hotel_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - hotel_network
  db_migrations:
    image: postgres:15-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:-hotel_admin}
      POSTGRES_DB: ${POSTGRES_DB:-hotel_db}
    volumes:
      - ./1_infrastructure/postgres/migrations:/migrations:ro
    command: ["sh", "-c", "for file in /migrations/*.sql; do psql -v ON_ERROR_STOP=1 -h postgres -U $${POSTGRES_USER} -d $${POSTGRES_DB} -f $$file; done"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hotel_network

  ai_service:
    build:
      context: ./2_ai_pricing_service
    restart: unless-stopped
    networks:
      - hotel_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend_core:
    build:
      context: ./3_backend_core
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-hotel_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DB_NAME: ${POSTGRES_DB:-hotel_db}
      AI_SERVICE_URL: http://ai_service:8000/api/v1/predict-price
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      HOTEL_TIMEZONE: ${HOTEL_TIMEZONE:-Asia/Bangkok}
    depends_on:
      db_migrations:
        condition: service_completed_successfully
      ai_service:
        condition: service_healthy
    networks:
      - hotel_network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/core/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend_nextjs:
    build:
      context: ./4_frontend_nextjs
      args:
        NEXT_PUBLIC_API_URL: /api/v1/core
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api/v1/core
      BACKEND_API_URL: http://backend_core:3000/api/v1/core
    depends_on:
      backend_core:
        condition: service_healthy
    networks:
      - hotel_network

  # 3. Kafka (Apache Official Image - Chế độ KRaft)
  kafka:
    image: apache/kafka:3.7.0
    container_name: hotel_kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # Cho phép Backend chạy trên máy tính truy cập qua localhost:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data_v2:/tmp/kafka-logs
    networks:
      - hotel_network

  # 4. Nginx - API Gateway
  nginx:
    image: nginx:alpine
    container_name: hotel_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./1_infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - hotel_network
    depends_on:
      frontend_nextjs:
        condition: service_started
      backend_core:
        condition: service_healthy

volumes:
  pg_data:
  kafka_data:
  kafka_data_v2:

networks:
  hotel_network:
    driver: bridge
