# Isolated demo only. Never shares the existing hotel's named volumes or .env.
name: hotelai-ai-v1-demo
services:
  postgres:
    image: postgres:15-alpine
    mem_limit: 384m
    environment:
      POSTGRES_USER: ai_v1_demo
      POSTGRES_PASSWORD: ${AI_V1_DB_PASSWORD:?Use ai-v1-local launcher}
      POSTGRES_DB: hotelai_ai_v1_demo
    ports: ["127.0.0.1:55321:5432"]
    volumes:
      - ai_v1_pg:/var/lib/postgresql/data
      - ../postgres/init_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../postgres/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./init-migration-history.sql:/docker-entrypoint-initdb.d/03-history.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_v1_demo -d hotelai_ai_v1_demo"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    mem_limit: 96m
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:56321:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  kafka_volume_init:
    image: apache/kafka:3.7.0
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown 1000:1000 /demo-kafka"]
    volumes: ["ai_v1_kafka:/demo-kafka"]
  kafka:
    image: apache/kafka:3.7.0
    mem_limit: 640m
    ports: ["127.0.0.1:59321:9092"]
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:59321
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes: ["ai_v1_kafka:/tmp/kafka-logs"]
    depends_on:
      kafka_volume_init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
volumes:
  ai_v1_pg:
  ai_v1_kafka:
