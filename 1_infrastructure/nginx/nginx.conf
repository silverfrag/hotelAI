events {
  worker_connections 1024;
}

http {
  include mime.types;
  server_tokens off;
  client_max_body_size 1m;

  log_format structured escape=json
    '{"timestamp":"$time_iso8601","event":"nginx_request",'
    '"request_id":"$request_id","method":"$request_method",'
    '"path":"$uri","status":$status,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time"}';
  access_log /var/log/nginx/access.log structured;

  limit_req_zone $binary_remote_addr zone=core_limit:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
  limit_req_status 429;

  # Docker can assign a new container IP after recreate/restart. Resolve the
  # service names continuously so Nginx does not keep proxying to a stale IP.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;

  upstream backend_core_upstream {
    zone backend_core_upstream 64k;
    server backend_core:3000 resolve;
  }

  upstream ai_service_upstream {
    zone ai_service_upstream 64k;
    server ai_service:8000 resolve;
  }

  upstream frontend_nextjs_upstream {
    zone frontend_nextjs_upstream 64k;
    server frontend_nextjs:3000 resolve;
  }

  proxy_http_version 1.1;
  proxy_connect_timeout 3s;
  proxy_send_timeout 10s;
  proxy_read_timeout 15s;
  proxy_hide_header X-Powered-By;
  # The gateway owns the public request ID. Hide the identical upstream value
  # so clients receive one header instead of two comma-joined values.
  proxy_hide_header X-Request-ID;

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Request-ID $request_id always;

    location ~ ^/api/v1/core/auth/(login|register)$ {
      limit_req zone=auth_limit burst=10 nodelay;
      proxy_pass http://backend_core_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    location /api/v1/core/ {
      limit_req zone=core_limit burst=40 nodelay;
      proxy_pass http://backend_core_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    location /api/v1/ai/ {
      limit_req zone=core_limit burst=20 nodelay;
      proxy_pass http://ai_service_upstream/api/v1/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_read_timeout 10s;
    }

    location / {
      proxy_pass http://frontend_nextjs_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_read_timeout 60s;
    }
  }
}
